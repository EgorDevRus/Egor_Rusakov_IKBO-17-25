[project]
name = "cargo-deps-graph"
version = "1.0.0"
description = "Визуализатор графа зависимостей пакетов Rust Cargo"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cargo-deps = "cargo_deps.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
